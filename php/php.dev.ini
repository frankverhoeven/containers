memory_limit = -1
max_execution_time = 60

display_errors = On
display_startup_errors = On

zend.assertions = 1
zend.exception_ignore_args = Off
opcache.validate_timestamps = 1

; Step debugging is opt-in. Activate it through an Xdebug browser helper or
; XDEBUG_TRIGGER/XDEBUG_SESSION; normal development requests stay untouched.
xdebug.mode = debug
xdebug.start_with_request = trigger

; Docker Desktop and OrbStack both expose the host IDE on this name.
xdebug.client_host = host.docker.internal
xdebug.client_port = 9003
xdebug.discover_client_host = 0

; Fail quickly if a debug trigger was left enabled while the IDE is not listening.
xdebug.connect_timeout_ms = 100

opcache.jit_buffer_size = 0
